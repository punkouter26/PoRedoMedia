name: CI (full suite)

# Weekly and on demand, never on push. Run it by hand (Actions -> CI (full suite) -> Run workflow)
# before a release, or after touching storage, auth or the render pipeline.
#
# The integration tests start their own Azurite through Testcontainers (Docker is on the runner)
# and run real ffmpeg. Without Docker they report as skipped, never as passed, so check the
# counts in the log.
#
# The Playwright UI suite is not here: it needs a running instance and reports as skipped without
# one. Run it locally with scripts/run-e2e.ps1.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  suites:
    name: Integration & API E2E Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # MinVer reads the version from tags

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}

      - name: Install ffmpeg and a font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Build
        run: dotnet build PoRedoMedia.slnx --configuration Release

      - name: Integration tests
        run: dotnet test tests/PoRedoMedia.IntegrationTests --no-build --configuration Release --verbosity normal

      - name: API E2E tests
        if: success() || failure()
        run: dotnet test tests/PoRedoMedia.E2EAPI --no-build --configuration Release --verbosity normal
